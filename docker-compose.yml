# Local environment: PostgreSQL + API with hot reload.
#   pnpm docker:up      start everything    pnpm docker:logs      follow the API
#   pnpm docker:down    stop                pnpm docker:reset-db  wipe the data
# Values come from .env (copy .env.example); if it does not exist, the defaults below are used.

name: agua-bella-vista

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agua}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agua_local}
      POSTGRES_DB: ${POSTGRES_DB:-agua}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      API_PORT: 3000
      TZ: UTC
      DATABASE_URL: postgres://${POSTGRES_USER:-agua}:${POSTGRES_PASSWORD:-agua_local}@db:5432/${POSTGRES_DB:-agua}
      DATABASE_URL_TEST: postgres://${POSTGRES_USER:-agua}:${POSTGRES_PASSWORD:-agua_local}@db:5432/${POSTGRES_DB:-agua}_test
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Host code is mounted so the API reloads on save;
      # node_modules stays inside the container (anonymous volumes).
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/shared/node_modules

volumes:
  pgdata:
